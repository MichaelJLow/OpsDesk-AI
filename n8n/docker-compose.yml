# OpsDesk AI — local n8n Community Edition
# Requires Docker Desktop. Start from repo root:
#   docker compose -f n8n/docker-compose.yml up -d
# UI: http://localhost:5678

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: opsdesk-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      # LOCAL DEV ONLY (DEC-008): SSL interception on this machine breaks
      # Google OAuth from inside the Linux container ("unable to verify the first certificate").
      # Do not use this in any shared/hosted environment. Prefer mounting a corp CA later.
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    name: opsdesk_n8n_data
